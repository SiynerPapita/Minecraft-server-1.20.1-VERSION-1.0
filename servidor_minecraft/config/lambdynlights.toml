# LambDynamicLights configuration.
# The dynamic lights mode
mode = "fancy"

# Light sources settings.
[light_sources]
	# Enables water-sensitive light sources check. This means that water-sensitive items will not light up when submerged in water.
	water_sensitive_check = true
	# Enable block entities light source.
	block_entities = true
	# Enable entities light source.
	entities = true
	# Enable first-person player light source.
	self = true
	# TNT lighting mode. May be off, simple or fancy.
	tnt = "off"
	# Creeper lighting mode. May be off, simple or fancy.
	creeper = "simple"

	[light_sources.settings]

		[light_sources.settings.entities]

			[light_sources.settings.entities.minecraft]
				item = true
				axolotl = true
				salmon = true
				zombie_villager = true
				tropical_fish = true
				slime = true
				skeleton = true
				bat = true
				zombie = true
				glow_squid = true
				witch = true
				glow_item_frame = false
				squid = true
				drowned = true
				spider = true
				creeper = true
				sheep = true
				experience_orb = true
				player = true
				enderman = true

			[light_sources.settings.entities.alexsmobs]
				flying_fish = true
				cockroach = true
				lobster = true
				seal = true
				centipede_body = true
				catfish = true
				centipede_head = true
				seagull = true
				flutter = true
				fly = true
				toucan = true
				centipede_tail = true
				terrapin = true

			[light_sources.settings.entities.biomeswevegone]
				man_o_war = true

